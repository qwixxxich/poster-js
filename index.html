<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebPoster</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="section" id="first">
        <div id="fruits-layer" aria-label="Flying fruits">
            <img class="fruit" src="assets/fruit/f1.png" alt="Fruit 1">
            <img class="fruit" src="assets/fruit/f2.png" alt="Fruit 2">
            <img class="fruit" src="assets/fruit/f3.png" alt="Fruit 3">
            <img class="fruit" src="assets/fruit/f4.png" alt="Fruit 4">
            <img class="fruit" src="assets/fruit/f5.png" alt="Fruit 5">
        </div>
        <div id="section1-bg" aria-hidden="true"></div>
        <div id="section1-overlay" aria-hidden="true"></div>
        <p
            id="section1-text"
            data-text="С&nbsp;началом эксплуатации Международной космической станции в&nbsp;1&#8201;990x&nbsp;— 2&#8201;000x&nbsp;годах питание вышло на&nbsp;новый уровень. Длительные миссии и&nbsp;международные экипажи потребовали разнообразия и&nbsp;гибкости. Космонавты и&nbsp;астронавты получили возможность заранее дегустировать меню и&nbsp;исключать продукты, которые им не&nbsp;нравятся. При&nbsp;этом состав нутриентов по-прежнему оставался унифицированным и&nbsp;рассчитанным по&nbsp;средним физиологическим показателям."
        ></p>
        <img id="earth" src="assets/earth.svg" alt="">
        <button id="scene-button" type="button" aria-label="Scene button" aria-pressed="false" disabled>
            <img id="scene-button-image" src="assets/buttonoff.svg" alt="">
        </button>
    </div>
    <div class="section" id="second">
        <img id="section2-bg" src="assets/section2.svg" alt="" aria-hidden="true">
        <div id="tube-viewport">
            <button id="tube" type="button" aria-label="Open prompt form" aria-expanded="false">
                <span id="tube-overlay" aria-hidden="true"></span>
            </button>
        </div>
        <p id="section2-text">
            В&nbsp;рационе появились национальные блюда разных стран, вакуумная упаковка, улучшенные текстуры и&nbsp;более сложные вкусовые профили.
        </p>
        <form id="tube-form" class="tube-form" hidden>
            <input
                id="prompt-input"
                name="prompt"
                type="text"
                placeholder="Например, маленькие машинки текстура"
                required
            />
            <button id="prompt-submit" type="submit">Отправить</button>
            <p id="status" class="status" aria-live="polite"></p>
        </form>
    </div>
    <div class="section" id="third">
        <div id="section3-bg" aria-hidden="true"></div>
        <img id="section3-recycle" src="assets/recycle.svg" alt="" aria-hidden="true">
        <div id="section3-pipe-stage" aria-hidden="true">
            <img id="section3-pipe" src="assets/pipe.svg" alt="" aria-hidden="true">
        </div>
        <img id="section3-pill-2" src="assets/pill2.svg" alt="" aria-hidden="true">
        <img id="section3-pill-1" src="assets/pill1.svg" alt="" aria-hidden="true">
        <img id="section3-tubus" src="assets/tubus.svg" alt="" aria-hidden="true">
        <div id="section3-tube-rocket-stage">
            <button id="section3-tube-rocket-trigger" type="button" aria-label="Drop tube into space">
                <img id="section3-tube-rocket" src="assets/tube-rocket.svg" alt="" aria-hidden="true">
            </button>
        </div>
        <div id="section3-tube" aria-hidden="true"></div>
        <img id="VectorLine" src="assets/Vectorline.svg" alt="">
    </div>
    <div class="section post-third-section" id="transition" hidden aria-hidden="true"></div>
    <div class="section post-third-section space-section" id="space" hidden aria-hidden="true">
        <div class="space-section__stars space-section__stars--far" aria-hidden="true"></div>
        <div class="space-section__stars space-section__stars--near" aria-hidden="true"></div>
        <img id="space-exit" src="assets/space-exit.svg" alt="" aria-hidden="true">
        <div id="space-hand-stage" aria-hidden="true">
            <div id="space-hand-float" aria-hidden="true">
                <img id="space-hand" src="assets/hand.svg" alt="" aria-hidden="true">
            </div>
        </div>
        <div id="space-tube" aria-hidden="true">
            <img id="space-tube-image" src="assets/tube-rocket.svg" alt="" aria-hidden="true">
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
